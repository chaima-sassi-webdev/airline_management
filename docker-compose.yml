version: '3.8'

services:
  # Service de Base de Données MySQL
  mysql_db:
    image: mysql:8.0
    container_name: airplane_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: AirplaneDb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # Service de l'Application .NET MVC
  webapp:
    build:
      context: ./MonProjetAirlplane
      dockerfile: Dockerfile
    container_name: airplane_webapp
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airplane_mysql;Port=3306;Database=airlane_management;Uid=admin;Pwd=TunisairInter23;
    depends_on:
      - mysql_db
    restart: always

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge